name: My First CI

on:
  push: 
    branches: 
      - main

jobs:
  hello: 
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello CI/CD!"

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls

      - name: Identity
        run: whoami
        

      
